  <!-- Instant Theme Initializer to prevent flash -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('mer_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored === 'dark' || (!stored && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>

  <!-- SPA fallback decode script for static host redirects with graceful error handling -->
  <script>
    (function (l) {
      try {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
            );
          } else {
            l.hash = '#' + decoded;
          }
        }
      } catch (err) {
        console.warn('[SPA Redirect] Navigation fallback:', err);
      }
    }(window.location))
  </script>
